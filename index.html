<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港巴士通 HK Bus Express - 支援九巴、城巴及新大嶼山巴士(NLB)</title>

    <!-- PWA 與行動裝置 Meta 設定 -->
    <meta name="application-name" content="HK Bus Express">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HK Bus Express">
    <meta name="theme-color" content="#0F172A" id="meta-theme-color">
    <meta name="description" content="全港巴士即時到站資訊平台：支援九龍巴士 (KMB)、城巴/新巴 (CTB) 及新大嶼山巴士 (NLB)，提供平日及假日詳細車費、即時 ETA 與互動路線地圖。">

    <!-- PWA App PNG 圖標與 Favicon 設定 -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kmb: '#E1251B',
                        ctb: '#00508F',
                        ctbYellow: '#FFD100',
                        nlb: '#00897B',
                        nlbDark: '#00695C',
                        surface: '#0F172A',
                        cardDark: '#1E293B',
                        borderDark: '#334155'
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Font Awesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 基礎全螢幕與流暢捲動 */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }

        /* 隱藏滾動條但保持滾動能力 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 自定義捲軸 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1E293B;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748B;
        }

        /* Leaflet 地圖深色濾鏡與自定義標記 */
        .leaflet-container {
            background: #0b1120 !important;
            font-family: inherit;
        }
        .custom-stop-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 700;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-stop-icon:hover, .custom-stop-icon.active {
            transform: scale(1.35);
            z-index: 1000 !important;
        }
        .custom-user-icon {
            background: #3B82F6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px #3B82F6;
            animation: pulse-blue 2s infinite;
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* 脈衝倒數計時動畫 */
        @keyframes countdown-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        .animate-live {
            animation: countdown-pulse 1.8s infinite;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col antialiased select-none">

    <!-- 頂部導覽列 (Responsive Header) -->
    <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 z-30 px-3 py-2.5 sm:px-5 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 via-teal-600 to-amber-500 flex items-center justify-center shadow-lg shadow-teal-900/30 overflow-hidden">
                <img src="./apple-touch-icon.png" alt="App Icon" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-bus text-white text-base\'></i>';">
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 id="appHeaderTitle" class="font-bold text-base sm:text-lg tracking-tight text-white flex items-center gap-1.5">
                        香港巴士通
                    </h1>
                </div>
                <p id="appHeaderSubtitle" class="text-[11px] text-slate-400 hidden sm:block">九巴 KMB • 城巴/新巴 CTB • 新大嶼山巴士 NLB 即時到站與詳細車費</p>
            </div>
        </div>

        <!-- 頂部功能區 -->
        <div class="flex items-center space-x-2">
            <!-- 搜尋框 -->
            <div class="relative w-32 sm:w-56 md:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input id="searchInput" type="text" placeholder="搜尋路線 (如 1, 11, 3M, 101)" 
                       class="w-full bg-slate-800 text-slate-100 placeholder-slate-400 text-xs sm:text-sm pl-8 pr-7 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all">
                <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-circle-xmark text-xs"></i>
                </button>
            </div>

            <!-- GPS 附近按鈕 -->
            <button id="nearbyBtn" title="尋找附近巴士站" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-teal-400 transition flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-location-crosshairs text-teal-400"></i>
                <span id="nearbyBtnText" class="hidden md:inline">附近車站</span>
            </button>

            <!-- 中英文切換按鈕 (Language Switcher) -->
            <button id="langToggleBtn" title="切換中英文 / Switch Language" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 hover:text-teal-400 text-xs font-bold transition flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-globe text-teal-400"></i>
                <span id="langToggleText">EN</span>
            </button>

            <!-- 手機版 地圖/清單 切換按鈕 -->
            <button id="toggleMobileViewBtn" class="lg:hidden p-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs flex items-center justify-center transition shadow">
                <i id="toggleIcon" class="fa-solid fa-map"></i>
            </button>
        </div>
    </header>

    <!-- 巴士公司篩選標籤 (Company Filter Bar) - 指定順序：全部路線 All, 九巴, 城巴/新巴, 新大嶼山巴士 -->
    <div class="bg-slate-900 border-b border-slate-800/80 px-3 py-1.5 flex items-center gap-2 overflow-x-auto no-scrollbar z-20">
        <button data-company="ALL" id="tabBtnAll" class="company-tab active px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap bg-teal-600 text-white shadow-sm">
            <i class="fa-solid fa-layer-group mr-1"></i> 全部路線 All
        </button>
        <button data-company="KMB" id="tabBtnKmb" class="company-tab px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-red-800/40">
            <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5"></span> 九巴 (KMB)
        </button>
        <button data-company="CTB" id="tabBtnCtb" class="company-tab px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-blue-800/40">
            <span class="inline-block w-2 h-2 rounded-full bg-yellow-400 mr-1.5"></span> 城巴/新巴 (CTB)
        </button>
        <button data-company="NLB" id="tabBtnNlb" class="company-tab px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-teal-700/50">
            <span class="inline-block w-2 h-2 rounded-full bg-teal-400 mr-1.5"></span> 新大嶼山巴士 (NLB)
        </button>
        <button data-company="FAV" id="tabBtnFav" class="company-tab px-3 py-1 rounded-full text-xs font-medium transition whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-amber-500/30">
            <i class="fa-solid fa-star text-amber-400 mr-1"></i> <span id="favTabLabel">我的收藏</span> (<span id="favCount">0</span>)
        </button>
    </div>

    <!-- 主內容區：響應式雙欄佈局 (Responsive Split Layout) -->
    <main class="flex-1 relative flex overflow-hidden">

        <!-- 左側主面板 (Sidebar / Content Drawer) -->
        <section id="sidebarSection" class="w-full lg:w-[440px] xl:w-[480px] h-full bg-slate-900/95 flex flex-col border-r border-slate-800 z-10 transition-all duration-300 relative shadow-2xl">
            
            <!-- 路線搜尋結果 / 推薦路線清單 -->
            <div id="routeListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
                <div id="loadingRoutes" class="flex flex-col items-center justify-center py-16 text-slate-400 space-y-3">
                    <div class="w-8 h-8 border-3 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
                    <p id="loadingRoutesText" class="text-xs">正在載入九巴、城巴/新巴與新大嶼山巴士路線及車費資料庫...</p>
                </div>
                <div id="routesGrid" class="space-y-2 hidden"></div>
                <div id="noResults" class="hidden text-center py-16 text-slate-400 space-y-2">
                    <i class="fa-regular fa-folder-open text-3xl text-slate-500"></i>
                    <p id="noResultsTitle" class="text-sm font-medium">找不到符合條件的路線</p>
                    <p id="noResultsSubtitle" class="text-xs text-slate-500">請嘗試輸入路線號碼，如 NLB 1, 11, 3M, 23, B2, 38 或 KMB 1A 等</p>
                </div>
            </div>

            <!-- 路線詳細資訊與 ETA 即時站點面板 -->
            <div id="routeDetailView" class="hidden absolute inset-0 bg-slate-900 z-20 flex flex-col">
                
                <!-- 路線詳細頭部 (Route Header) -->
                <div class="p-3.5 bg-slate-850 border-b border-slate-800 shadow-md">
                    <div class="flex items-center justify-between mb-2">
                        <button id="backToRoutesBtn" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-arrow-left"></i> <span id="backBtnText">返回路線列表</span>
                        </button>
                        <div class="flex items-center space-x-1.5">
                            <button id="favCurrentRouteBtn" class="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-amber-400 transition" title="收藏路線">
                                <i id="favCurrentIcon" class="fa-regular fa-star text-sm"></i>
                            </button>
                            <button id="refreshEtaBtn" class="px-2.5 py-1 rounded bg-teal-600 hover:bg-teal-500 text-white text-xs flex items-center gap-1.5 transition shadow">
                                <i id="refreshEtaIcon" class="fa-solid fa-rotate-right"></i>
                                <span id="refreshCounterText">15s</span>
                            </button>
                        </div>
                    </div>

                    <!-- 路線號碼與起訖點 -->
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-2.5">
                            <span id="detailRouteBadge" class="px-2.5 py-1 rounded-lg font-black text-lg tracking-wider text-white bg-teal-600 shadow">
                                --
                            </span>
                            <div>
                                <div id="detailCompanyTag" class="text-[10px] uppercase font-bold tracking-wider text-teal-400 flex items-center gap-1">
                                    新大嶼山巴士 (NLB)
                                </div>
                                <h2 id="detailRouteTitle" class="text-sm sm:text-base font-bold text-white line-clamp-1">
                                    載入中...
                                </h2>
                            </div>
                        </div>
                    </div>

                    <!-- 方向切換按鈕 (Bound / Direction Switcher) -->
                    <div id="boundSwitchContainer" class="mt-2.5 grid grid-cols-2 gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
                        <button id="boundBtnOut" class="py-1 px-2 rounded-md font-medium text-center transition bg-teal-600 text-white truncate">
                            往 目的地
                        </button>
                        <button id="boundBtnIn" class="py-1 px-2 rounded-md font-medium text-center transition text-slate-400 hover:text-white truncate">
                            往 起點
                        </button>
                    </div>

                    <!-- ★ 車費資訊卡片 (Fare Information Box) -->
                    <div id="fareInfoCard" class="mt-2.5 p-2.5 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs space-y-1.5">
                        <div class="flex items-center justify-between text-slate-300 font-semibold border-b border-slate-700/60 pb-1">
                            <span id="fareTitleText" class="flex items-center gap-1.5 text-teal-300">
                                <i class="fa-solid fa-ticket"></i> 車費資料 (Bus Fare)
                            </span>
                            <span id="govSchemeTag" class="text-[10px] text-slate-400 px-1.5 py-0.5 rounded bg-slate-700 font-normal">政府 $2 優惠適用</span>
                        </div>
                        <div id="fareDetailsContent" class="grid grid-cols-2 gap-2 text-[11px] pt-0.5">
                            <!-- 動態填充車費內容 -->
                        </div>
                    </div>
                </div>

                <!-- 沿途車站與即時 ETA 列表 -->
                <div id="stopsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2 relative">
                    <div id="stopsLoading" class="flex flex-col items-center justify-center py-12 text-slate-400 space-y-2">
                        <div class="w-6 h-6 border-2 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
                        <p id="stopsLoadingText" class="text-xs">正在載入站點與即時抵站時間...</p>
                    </div>
                    <div id="stopsTimeline" class="space-y-2.5 relative pl-4 before:absolute before:left-2 before:top-3 before:bottom-3 before:w-0.5 before:bg-slate-700 hidden">
                        <!-- 動態站點節點 -->
                    </div>
                </div>

            </div>

        </section>

        <!-- 右側互動式地圖 (Interactive Map Pane) -->
        <section id="mapSection" class="flex-1 h-full w-full relative z-0">
            <div id="map" class="h-full w-full"></div>

            <!-- 地圖控制浮動工具列 -->
            <div class="absolute top-4 right-4 z-[400] flex flex-col space-y-2">
                <button id="recenterMapBtn" title="重新定位到路線" class="w-10 h-10 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-slate-200 shadow-xl flex items-center justify-center transition">
                    <i class="fa-solid fa-expand text-sm"></i>
                </button>
                <button id="userLocationBtn" title="定位我的位置" class="w-10 h-10 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-teal-400 shadow-xl flex items-center justify-center transition">
                    <i class="fa-solid fa-crosshairs text-sm"></i>
                </button>
            </div>

            <!-- 地圖底部提示狀態列 -->
            <div id="mapStatusBar" class="absolute bottom-4 left-4 right-4 md:left-6 md:right-auto md:max-w-md z-[400] pointer-events-none hidden">
                <div class="bg-slate-900/90 backdrop-blur border border-slate-700/80 px-3 py-2 rounded-xl text-xs text-slate-300 shadow-2xl flex items-center justify-between pointer-events-auto">
                    <span id="mapStatusText" class="truncate">點擊站點可查看詳細到站預報</span>
                    <button id="closeMapStatus" class="ml-2 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
        </section>

    </main>

    <!-- 訊息提示通知元件 (Toast notification) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800/95 border border-slate-600 text-slate-100 px-4 py-2 rounded-xl text-xs shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-info text-teal-400"></i>
        <span id="toastMsg">通知訊息</span>
    </div>

<script>

    // --- 1. 初始化 Leaflet 地圖 ---
    function initMap() {
        AppState.map = L.map('map', {
            zoomControl: false,

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(AppState.map);

        AppState.markersLayer = L.layerGroup().addTo(AppState.map);
    }

    // --- 2. 事件監聽設定 ---
    function setupEventListeners() {
        // 搜尋輸入
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            clearBtn.classList.toggle('hidden', val.length === 0);
            renderRouteList();
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            renderRouteList();
            searchInput.focus();
        });

        // 語言切換按鈕事件
        document.getElementById('langToggleBtn').addEventListener('click', toggleLanguage);

        // 公司標籤切換
        document.querySelectorAll('.company-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.company-tab').forEach(b => {
                    b.classList.remove('active', 'bg-teal-600', 'text-white');
                    b.classList.add('bg-slate-800', 'text-slate-300');
                });
                btn.classList.add('active', 'bg-teal-600', 'text-white');
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                
                AppState.currentCompanyFilter = btn.dataset.company;
                renderRouteList();
            });
        });

        // 返回路線清單按鈕
        document.getElementById('backToRoutesBtn').addEventListener('click', () => {
            document.getElementById('routeDetailView').classList.add('hidden');
            clearInterval(AppState.countdownTimer);
            AppState.markersLayer.clearLayers();
            if (AppState.routePolyline) {
                AppState.map.removeLayer(AppState.routePolyline);
                AppState.routePolyline = null;
            }
        });

        // 刷新 ETA
        document.getElementById('refreshEtaBtn').addEventListener('click', () => {
            if (AppState.selectedRoute) {
                const icon = document.getElementById('refreshEtaIcon');
                icon.classList.add('animate-spin');
                fetchRouteStopsAndEta(AppState.selectedRoute, AppState.selectedBound).finally(() => {
                    setTimeout(() => icon.classList.remove('animate-spin'), 600);
                });
            }
        });

        // 收藏當前路線按鈕
        document.getElementById('favCurrentRouteBtn').addEventListener('click', toggleCurrentFavorite);

        // 方向切換
        document.getElementById('boundBtnOut').addEventListener('click', () => switchBound('O'));
        document.getElementById('boundBtnIn').addEventListener('click', () => switchBound('I'));

        // 重設地圖中心
        document.getElementById('recenterMapBtn').addEventListener('click', fitMapToStops);

        // GPS 使用者定位
        document.getElementById('userLocationBtn').addEventListener('click', locateUser);
        document.getElementById('nearbyBtn').addEventListener('click', locateUserAndFindNearby);

        // 手機版地圖/清單視圖切換

            document.getElementById('mapStatusBar').classList.add('hidden');
        });

    // --- 3. 抓取所有公司路線 (KMB, CTB, NLB) ---
    async function fetchAllRoutes() {
        const loadingEl = document.getElementById('loadingRoutes');
        const gridEl = document.getElementById('routesGrid');

        try {
            const [kmbRes, ctbRes, nlbRes] = await Promise.allSettled([
                fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/').then(r => r.json()),
                fetch('https://rt.data.gov.hk/v2/transport/citybus/route/ctb').then(r => r.json()),
                fetch('https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list').then(r => r.json())
            ]);

            const allRoutes = [];

            // 1. 九巴 (KMB)
            if (kmbRes.status === 'fulfilled' && kmbRes.value && kmbRes.value.data) {
                kmbRes.value.data.forEach(r => {
                    allRoutes.push({
                        company: 'KMB',
                        companyName: '九巴',
                        companyNameEn: 'KMB',
                        route: r.route,
                        orig_tc: r.orig_tc,
                        dest_tc: r.dest_tc,
                        orig_en: r.orig_en,
                        dest_en: r.dest_en,
                        service_type: r.service_type || '1',
                        bound: r.bound || 'O'
                    });
                });
            }

            // 2. 城巴 / 新巴 (CTB)
            if (ctbRes.status === 'fulfilled' && ctbRes.value && ctbRes.value.data) {
                ctbRes.value.data.forEach(r => {
                    allRoutes.push({
                        company: 'CTB',
                        companyName: '城巴/新巴',
                        companyNameEn: 'CTB/NWFB',
                        route: r.route,
                        orig_tc: r.orig_tc,
                        dest_tc: r.dest_tc,
                        orig_en: r.orig_en,
                        dest_en: r.dest_en,
                        service_type: '1',
                        bound: 'O'
                    });
                });
            }

            // 3. 新大嶼山巴士 (NLB)
            if (nlbRes.status === 'fulfilled' && nlbRes.value && nlbRes.value.routes) {
                nlbRes.value.routes.forEach(r => {
                    const rNo = (r.routeNo || '').trim();
                    const nameTc = r.routeName_c || '';
                    const nameEn = r.routeName_e || '';

                    let orig_tc = nameTc, dest_tc = '';
                    if (nameTc.includes('>')) {
                        const parts = nameTc.split('>');
                        orig_tc = parts[0].trim();
                        dest_tc = parts[1].trim();
                    } else if (nameTc.includes('-')) {
                        const parts = nameTc.split('-');
                        orig_tc = parts[0].trim();
                        dest_tc = parts[1].trim();
                    }

                    let orig_en = nameEn, dest_en = '';
                    if (nameEn.includes('>')) {
                        const parts = nameEn.split('>');
                        orig_en = parts[0].trim();
                        dest_en = parts[1].trim();
                    }

                    const meta = NLB_STATIC_METADATA[rNo] || {};
                    const normalFare = r.fare_c || r.fareNormal || meta.normalFare || '--';
                    const holidayFare = r.fare_h || r.fareHoliday || meta.holidayFare || '--';

                    AppState.nlbFaresDb[r.routeId] = {
                        normalFare: normalFare,
                        holidayFare: holidayFare,
                        type: meta.type || '大嶼山專線'
                    };

                    allRoutes.push({
                        company: 'NLB',
                        companyName: '嶼巴',
                        companyNameEn: 'NLB',
                        routeId: r.routeId,
                        route: rNo,
                        orig_tc: orig_tc,
                        dest_tc: dest_tc,
                        orig_en: orig_en,
                        dest_en: dest_en,
                        service_type: '1',
                        bound: 'O',
                        normalFare: normalFare,
                        holidayFare: holidayFare,
                        routeType: meta.type || '大嶼山專線'
                    });
                });
            }

            // 靜態備份
            if (!allRoutes.some(r => r.company === 'NLB')) {
                Object.keys(NLB_STATIC_METADATA).forEach((rNo, idx) => {
                    const item = NLB_STATIC_METADATA[rNo];
                    const parts = item.desc.split('⇄');
                    allRoutes.push({
                        company: 'NLB',
                        companyName: '嶼巴',
                        companyNameEn: 'NLB',
                        routeId: String(idx + 1),
                        route: rNo,
                        orig_tc: parts[0]?.trim() || '',
                        dest_tc: parts[1]?.trim() || '',
                        orig_en: 'Lantau Island',
                        dest_en: 'Lantau Island',
                        service_type: '1',
                        bound: 'O',
                        normalFare: item.normalFare,
                        holidayFare: item.holidayFare,
                        routeType: item.type
                    });
                });
            }

            AppState.routes = allRoutes;
            loadingEl.classList.add('hidden');
            gridEl.classList.remove('hidden');
            renderRouteList();

        } catch (error) {
            console.error('路線資料載入失敗:', error);
        }
    }

    // --- 4. 渲染路線列表 (雙語支援) ---
    function renderRouteList() {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        const filter = AppState.currentCompanyFilter;
        const gridEl = document.getElementById('routesGrid');
        const noResultsEl = document.getElementById('noResults');
        const isEn = AppState.lang === 'en';

        let filtered = AppState.routes.filter(r => {
            if (filter === 'FAV') {
                const key = `${r.company}_${r.route}_${r.service_type || '1'}`;
                if (!AppState.favorites.includes(key)) return false;
            } else if (filter !== 'ALL' && r.company !== filter) {
                return false;
            }

            if (query) {
                const matchRoute = r.route.toUpperCase().includes(query);
                const matchOrig = (r.orig_tc || '').toUpperCase().includes(query) || (r.orig_en || '').toUpperCase().includes(query);
                const matchDest = (r.dest_tc || '').toUpperCase().includes(query) || (r.dest_en || '').toUpperCase().includes(query);
                return matchRoute || matchOrig || matchDest;
            }
            return true;
        });

        filtered.sort((a, b) => {
            const numA = parseInt(a.route) || 9999;
            const numB = parseInt(b.route) || 9999;
            if (numA !== numB) return numA - numB;
            return a.route.localeCompare(b.route);
        });

        if (filtered.length === 0) {
            gridEl.innerHTML = '';
            noResultsEl.classList.remove('hidden');
            return;
        }

        noResultsEl.classList.add('hidden');

        gridEl.innerHTML = filtered.slice(0, 100).map(r => {
            const companyColor = r.company === 'KMB' ? 'bg-red-600 text-white' : 
                                 r.company === 'CTB' ? 'bg-amber-400 text-slate-900' : 'bg-teal-600 text-white';
            const companyBorder = r.company === 'KMB' ? 'border-red-900/40 hover:border-red-500/80' : 
                                  r.company === 'CTB' ? 'border-yellow-900/40 hover:border-yellow-400/80' : 'border-teal-800/50 hover:border-teal-400/80';
            
            const favKey = `${r.company}_${r.route}_${r.service_type || '1'}`;
            const isFav = AppState.favorites.includes(favKey);

            const origName = isEn ? (r.orig_en || r.orig_tc) : (r.orig_tc || r.orig_en);
            const destName = isEn ? (r.dest_en || r.dest_tc) : (r.dest_tc || r.dest_en);
            const compName = isEn ? r.companyNameEn : r.companyName;

            let fareTag = '';
            if (r.company === 'NLB') {
                const nFare = r.normalFare && r.normalFare !== '--' ? `$${Number(r.normalFare).toFixed(1)}` : (isEn ? 'Sectional' : '依段收費');
                const hFare = r.holidayFare && r.holidayFare !== '--' ? `$${Number(r.holidayFare).toFixed(1)}` : nFare;
                fareTag = `
                    <div class="mt-2 pt-1.5 border-t border-slate-700/50 flex items-center justify-between text-[11px]">
                        <span class="text-teal-300 font-medium">${isEn ? 'Weekday' : '平日'}: <b class="text-white">${nFare}</b></span>
                        <span class="text-amber-300 font-medium">${isEn ? 'Holiday' : '假日'}: <b class="text-white">${hFare}</b></span>
                    </div>
                `;
            }

            return `
                <div onclick="selectRoute('${r.company}', '${r.route}', '${r.service_type || '1'}', '${r.routeId || ''}')" 
                     class="group p-3 rounded-xl bg-slate-800/90 hover:bg-slate-750 border ${companyBorder} cursor-pointer transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="w-14 h-9 rounded-lg font-black text-base flex items-center justify-center ${companyColor} shadow-md tracking-wider">
                                ${r.route}
                            </span>
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.2 rounded bg-slate-700 text-slate-300">
                                        ${compName}
                                    </span>
                                    ${r.routeType ? `<span class="text-[10px] text-teal-400 font-medium">${r.routeType}</span>` : ''}
                                </div>
                                <div class="text-xs sm:text-sm font-bold text-white mt-0.5 flex items-center gap-1">
                                    <span>${origName || '--'}</span>
                                    <i class="fa-solid fa-arrow-right text-[10px] text-slate-400"></i>
                                    <span>${destName || '--'}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); toggleFavorite('${r.company}', '${r.route}', '${r.service_type || '1'}')" 
                                class="p-1.5 text-slate-500 hover:text-amber-400 transition" title="加入收藏">
                            <i class="${isFav ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star'} text-sm"></i>
                        </button>
                    </div>
                    ${fareTag}
                </div>
            `;
        }).join('');
    }

    // --- 5. 選取路線與載入站點資訊 ---
    async function selectRoute(company, route, service_type = '1', routeId = '') {
        const found = AppState.routes.find(r => r.company === company && r.route === route && (r.service_type || '1') === service_type);
        if (!found) return;

        AppState.selectedRoute = found;
        AppState.selectedBound = 'O';

        const detailView = document.getElementById('routeDetailView');
        detailView.classList.remove('hidden');

        const isEn = AppState.lang === 'en';
        document.getElementById('detailRouteBadge').innerText = found.route;
        document.getElementById('detailRouteBadge').className = `px-2.5 py-1 rounded-lg font-black text-lg tracking-wider text-white shadow ${
            company === 'KMB' ? 'bg-red-600' : company === 'CTB' ? 'bg-amber-500 text-slate-950' : 'bg-teal-600'
        }`;

        const compText = isEn ? found.companyNameEn : found.companyName;
        document.getElementById('detailCompanyTag').innerText = `${compText} (${found.company})`;

        const origName = isEn ? (found.orig_en || found.orig_tc) : (found.orig_tc || found.orig_en);
        const destName = isEn ? (found.dest_en || found.dest_tc) : (found.dest_tc || found.dest_en);
        document.getElementById('detailRouteTitle').innerText = `${origName} ⇄ ${destName}`;

        updateBoundBtnTexts();
        renderFareDetails(found);
        updateDetailFavIcon();

        await fetchRouteStopsAndEta(found, AppState.selectedBound);
        startCountdownTimer();

        if (window.innerWidth < 1024 && AppState.isMobileMapActive) {
            toggleMobileView();
        }
    }

    function updateBoundBtnTexts() {
        if (!AppState.selectedRoute) return;
        const r = AppState.selectedRoute;
        const isEn = AppState.lang === 'en';
        const dict = I18N[AppState.lang];

        const origName = isEn ? (r.orig_en || r.orig_tc) : (r.orig_tc || r.orig_en);
        const destName = isEn ? (r.dest_en || r.dest_tc) : (r.dest_tc || r.dest_en);

        document.getElementById('boundBtnOut').innerText = `${dict.boundOut}${destName || origName}`;
        document.getElementById('boundBtnIn').innerText = `${dict.boundIn}${origName || destName}`;
        updateBoundBtnStyles();
    }

    // --- 6. 渲染詳細車費面板 ---
    function renderFareDetails(routeObj) {
        const fareContent = document.getElementById('fareDetailsContent');
        const dict = I18N[AppState.lang];

        if (routeObj.company === 'NLB') {
            const meta = NLB_STATIC_METADATA[routeObj.route] || {};
            const normal = routeObj.normalFare && routeObj.normalFare !== '--' ? `$${Number(routeObj.normalFare).toFixed(1)}` : (meta.normalFare ? `$${meta.normalFare.toFixed(1)}` : '--');
            const holiday = routeObj.holidayFare && routeObj.holidayFare !== '--' ? `$${Number(routeObj.holidayFare).toFixed(1)}` : (meta.holidayFare ? `$${meta.holidayFare.toFixed(1)}` : normal);

            fareContent.innerHTML = `
                <div class="bg-slate-900/90 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">${dict.fareWeekday}</span>
                    <span class="text-base font-bold text-teal-300">${normal}</span>
                </div>
                <div class="bg-slate-900/90 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">${dict.fareHoliday}</span>
                    <span class="text-base font-bold text-amber-300">${holiday}</span>
                </div>
                <div class="col-span-2 text-[10px] text-slate-400 flex items-center justify-between">
                    <span>${dict.fareDiscountInfo}</span>
                    <span>${dict.farePaymentInfo}</span>
                </div>
            `;
        } else {
            fareContent.innerHTML = `
                <div class="bg-slate-900/90 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">${dict.fareStandard}</span>
                    <span class="text-base font-bold text-slate-100">${dict.fareStandardNote}</span>
                </div>
                <div class="bg-slate-900/90 p-2 rounded border border-slate-700">
                    <span class="text-slate-400 block text-[10px]">${dict.fareSpecial}</span>
                    <span class="text-base font-bold text-emerald-400">$2.0</span>
                </div>
                <div class="col-span-2 text-[10px] text-slate-400">
                    ${dict.fareSpecialNote}
                </div>
            `;
        }
    }

    // --- 7. 抓取車站列表與即時 ETA ---
    async function fetchRouteStopsAndEta(routeObj, bound) {
        const timelineEl = document.getElementById('stopsTimeline');
        const loadingEl = document.getElementById('stopsLoading');
        
        loadingEl.classList.remove('hidden');
        timelineEl.classList.add('hidden');

        try {
            let stopsData = [];

            // A. NLB 站點與 ETA
            if (routeObj.company === 'NLB') {
                const routeId = routeObj.routeId || '1';
                const stopsRes = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${routeId}`).then(r => r.json());
                
                if (stopsRes && stopsRes.stops && stopsRes.stops.length > 0) {
                    let nlbStops = stopsRes.stops;
                    if (bound === 'I') nlbStops = [...nlbStops].reverse();

                    const etaPromises = nlbStops.map(async (st, idx) => {
                        let etas = [];
                        try {
                            const langParam = AppState.lang === 'en' ? 'en' : 'zh';
                            const etaRes = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${st.stopId}&language=${langParam}`).then(r => r.json());
                            if (etaRes && etaRes.estimatedArrivals) {
                                etas = etaRes.estimatedArrivals.map(item => ({
                                    eta: item.estimatedArrivalTime,
                                    remark: item.routeVariantName || (item.departed === 1 ? 'Departed' : ''),
                                    isSchedule: item.noSchedule === true
                                }));
                            }
                        } catch (e) {}

                        return {
                            stop_id: st.stopId,
                            seq: idx + 1,
                            name_tc: st.stopName_c || st.stopName_e,
                            name_en: st.stopName_e,
                            lat: parseFloat(st.latitude),
                            lng: parseFloat(st.longitude),
                            fare: st.fare || routeObj.normalFare || null,
                            fareHoliday: st.fareHoliday || routeObj.holidayFare || null,
                            etas: etas
                        };
                    });

                    stopsData = await Promise.all(etaPromises);
                }
            }
            // B. 九巴 (KMB)
            else if (routeObj.company === 'KMB') {
                const kmbBound = bound === 'O' ? 'outbound' : 'inbound';
                const sType = routeObj.service_type || '1';
                const routeStopsRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${routeObj.route}/${kmbBound}/${sType}`).then(r => r.json());

                if (routeStopsRes && routeStopsRes.data) {
                    const rawStops = routeStopsRes.data;
                    const stopPromises = rawStops.map(async (item) => {
                        const [stopInfo, etaInfo] = await Promise.allSettled([
                            fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`).then(r => r.json()),
                            fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${item.stop}/${routeObj.route}/${sType}`).then(r => r.json())
                        ]);

                        const st = stopInfo.status === 'fulfilled' ? stopInfo.value.data : null;
                        const etas = etaInfo.status === 'fulfilled' && etaInfo.value.data ? 
                            etaInfo.value.data.filter(e => e.dir === (bound === 'O' ? 'O' : 'I') || e.service_type == sType)
                                .map(e => ({ eta: e.eta, remark: e.rmk_tc || '', isSchedule: e.is_schedule === 'Y' })) : [];

                        return {
                            stop_id: item.stop,
                            seq: parseInt(item.seq),
                            name_tc: st ? st.name_tc : `Stop (${item.stop})`,
                            name_en: st ? st.name_en : `Stop (${item.stop})`,
                            lat: st ? parseFloat(st.lat) : 22.3193,
                            lng: st ? parseFloat(st.long) : 114.1694,
                            etas: etas
                        };
                    });

                    stopsData = await Promise.all(stopPromises);
                }
            }
            // C. 城巴 / 新巴 (CTB)
            else if (routeObj.company === 'CTB') {
                const ctbBound = bound === 'O' ? 'outbound' : 'inbound';
                const routeStopsRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${routeObj.route}/${ctbBound}`).then(r => r.json());

                if (routeStopsRes && routeStopsRes.data) {
                    const rawStops = routeStopsRes.data;
                    const stopPromises = rawStops.map(async (item) => {
                        const [stopInfo, etaInfo] = await Promise.allSettled([
                            fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${item.stop}`).then(r => r.json()),
                            fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/${item.stop}/${routeObj.route}`).then(r => r.json())
                        ]);

                        const st = stopInfo.status === 'fulfilled' ? stopInfo.value.data : null;
                        const etas = etaInfo.status === 'fulfilled' && etaInfo.value.data ? 
                            etaInfo.value.data.filter(e => e.dir === (bound === 'O' ? 'O' : 'I'))
                                .map(e => ({ eta: e.eta, remark: e.rmk_tc || '', isSchedule: e.is_schedule === 'Y' })) : [];

                        return {
                            stop_id: item.stop,
                            seq: parseInt(item.seq),
                            name_tc: st ? st.name_tc : `Stop (${item.stop})`,
                            name_en: st ? st.name_en : `Stop (${item.stop})`,
                            lat: st ? parseFloat(st.lat) : 22.3193,
                            lng: st ? parseFloat(st.long) : 114.1694,
                            etas: etas
                        };
                    });

                    stopsData = await Promise.all(stopPromises);
                }
            }

            AppState.currentStops = stopsData;
            renderStopsList(stopsData);
            renderStopsOnMap(stopsData);

        } catch (error) {
            console.error('車站載入失敗:', error);
        } finally {
            loadingEl.classList.add('hidden');
            timelineEl.classList.remove('hidden');
        }
    }

    // --- 8. 渲染車站清單 ---
    function renderStopsList(stops) {
        const timelineEl = document.getElementById('stopsTimeline');
        const dict = I18N[AppState.lang];
        const isEn = AppState.lang === 'en';

        if (!stops || stops.length === 0) {
            timelineEl.innerHTML = `
                <div class="text-center py-10 text-slate-400 space-y-1">
                    <i class="fa-solid fa-circle-exclamation text-xl text-slate-500"></i>
                    <p class="text-xs">${dict.noStops}</p>
                </div>
            `;
            return;
        }

        timelineEl.innerHTML = stops.map((stop, idx) => {
            let etaHtml = '';
            if (stop.etas && stop.etas.length > 0) {
                etaHtml = stop.etas.slice(0, 3).map((e) => {
                    const diffMins = calculateMinutesDiff(e.eta);
                    let badgeColor = 'bg-teal-600 text-white';
                    let timeText = `${diffMins} ${dict.minUnit}`;

                    if (diffMins === null) {
                        timeText = dict.noEta;
                        badgeColor = 'bg-slate-700 text-slate-300';
                    } else if (diffMins <= 1) {
                        timeText = dict.arriving;
                        badgeColor = 'bg-emerald-600 text-white animate-live';
                    } else if (diffMins <= 5) {
                        badgeColor = 'bg-teal-500 text-white';
                    } else {
                        badgeColor = 'bg-slate-700 text-slate-200';
                    }

                    const timeFormatted = formatTime(e.eta);

                    return `
                        <div class="flex items-center justify-between text-xs py-1 px-2 rounded-lg bg-slate-900/90 border border-slate-700/60">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded font-bold ${badgeColor} text-[11px]">
                                    ${timeText}
                                </span>
                                ${e.remark ? `<span class="text-[10px] text-amber-300 bg-amber-950/60 px-1.5 py-0.5 rounded border border-amber-800/40">${e.remark}</span>` : ''}
                            </div>
                            <span class="text-slate-400 font-mono text-[11px]">${timeFormatted}</span>
                        </div>
                    `;
                }).join('');
            } else {
                etaHtml = `
                    <div class="text-[11px] text-slate-400 italic py-1 px-2 bg-slate-900/60 rounded border border-slate-800">
                        ${dict.noEta}
                    </div>
                `;
            }

            const stopFareHtml = stop.fare ? `
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-teal-950 text-teal-300 border border-teal-800/60">
                    $${Number(stop.fare).toFixed(1)} ${stop.fareHoliday ? `| H: $${Number(stop.fareHoliday).toFixed(1)}` : ''}
                </span>
            ` : '';

            const stopName = isEn ? (stop.name_en || stop.name_tc) : (stop.name_tc || stop.name_en);
            const subName = isEn ? stop.name_tc : stop.name_en;

            return `
                <div class="group relative bg-slate-800/80 hover:bg-slate-750 p-3 rounded-xl border border-slate-700 transition cursor-pointer"
                     onclick="focusStopOnMap(${stop.lat}, ${stop.lng}, '${stopName}', ${idx})">
                    
                    <div class="absolute -left-[23px] top-4 w-3.5 h-3.5 rounded-full border-2 border-slate-900 bg-teal-500 group-hover:scale-125 transition"></div>

                    <div class="flex items-start justify-between mb-1.5">
                        <div class="flex items-center space-x-2">
                            <span class="text-[11px] font-mono font-bold text-slate-400 w-5">
                                ${stop.seq || idx + 1}.
                            </span>
                            <div>
                                <h3 class="text-xs sm:text-sm font-bold text-slate-100 group-hover:text-teal-300 transition">
                                    ${stopName}
                                </h3>
                                <p class="text-[10px] text-slate-400 truncate">${subName || ''}</p>
                            </div>
                        </div>
                        ${stopFareHtml}
                    </div>

                    <div class="space-y-1 mt-2">
                        ${etaHtml}
                    </div>
                </div>
            `;
        }).join('');
    }

    // --- 9. 在 Leaflet 地圖上繪製站點與軌跡 ---
    function renderStopsOnMap(stops) {
        AppState.markersLayer.clearLayers();
        if (AppState.routePolyline) {
            AppState.map.removeLayer(AppState.routePolyline);
            AppState.routePolyline = null;
        }

        const validCoords = [];
        const company = AppState.selectedRoute ? AppState.selectedRoute.company : 'NLB';
        const pinBg = company === 'KMB' ? '#E1251B' : company === 'CTB' ? '#EAB308' : '#00897B';

        stops.forEach((stop, idx) => {
            if (isNaN(stop.lat) || isNaN(stop.lng) || stop.lat === 0) return;

            const latLng = [stop.lat, stop.lng];
            validCoords.push(latLng);

            const customIcon = L.divIcon({
                className: 'custom-stop-marker-wrapper',
                html: `<div class="custom-stop-icon" style="background-color: ${pinBg}; width: 22px; height: 22px;">${idx + 1}</div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            const marker = L.marker(latLng, { icon: customIcon }).addTo(AppState.markersLayer);

            const stopName = AppState.lang === 'en' ? (stop.name_en || stop.name_tc) : (stop.name_tc || stop.name_en);

            const popupContent = `
                <div class="p-1 text-slate-900 font-sans">
                    <div class="text-[11px] font-bold text-slate-500 uppercase">${company} • Stop ${idx + 1}</div>
                    <div class="text-sm font-bold mt-0.5">${stopName}</div>
                    ${stop.fare ? `<div class="text-xs font-semibold text-teal-700 mt-1">Fare: $${Number(stop.fare).toFixed(1)}</div>` : ''}
                </div>
            `;
            marker.bindPopup(popupContent);
        });

        if (validCoords.length > 1) {
            AppState.routePolyline = L.polyline(validCoords, {
                color: pinBg,
                weight: 4,
                opacity: 0.85,
                lineJoin: 'round'
            }).addTo(AppState.map);

            AppState.map.fitBounds(AppState.routePolyline.getBounds(), { padding: [40, 40] });
        } else if (validCoords.length === 1) {
            AppState.map.setView(validCoords[0], 15);
        }
    }

    // --- 10. 地圖聚焦站點 ---
    function focusStopOnMap(lat, lng, name, idx) {
        if (isNaN(lat) || isNaN(lng)) return;

        AppState.map.flyTo([lat, lng], 16, { animate: true, duration: 1 });

        const statusBar = document.getElementById('mapStatusBar');
        const statusText = document.getElementById('mapStatusText');
        statusText.innerHTML = `Stop ${idx + 1}: <b>${name}</b>`;
        statusBar.classList.remove('hidden');

        if (window.innerWidth < 1024 && !AppState.isMobileMapActive) {
            toggleMobileView();
        }
    }

    function fitMapToStops() {
        if (AppState.routePolyline) {
            AppState.map.fitBounds(AppState.routePolyline.getBounds(), { padding: [40, 40] });
        }
    }

    // --- 11. 方向切換邏輯 ---
    function switchBound(bound) {
        if (AppState.selectedBound === bound) return;
        AppState.selectedBound = bound;
        updateBoundBtnStyles();
        if (AppState.selectedRoute) {
            fetchRouteStopsAndEta(AppState.selectedRoute, bound);
        }
    }

    function updateBoundBtnStyles() {
        const btnOut = document.getElementById('boundBtnOut');
        const btnIn = document.getElementById('boundBtnIn');

        if (AppState.selectedBound === 'O') {
            btnOut.className = 'py-1 px-2 rounded-md font-bold text-center transition bg-teal-600 text-white truncate shadow';
            btnIn.className = 'py-1 px-2 rounded-md font-medium text-center transition text-slate-400 hover:text-white truncate';
        } else {
            btnIn.className = 'py-1 px-2 rounded-md font-bold text-center transition bg-teal-600 text-white truncate shadow';
            btnOut.className = 'py-1 px-2 rounded-md font-medium text-center transition text-slate-400 hover:text-white truncate';
        }
    }

    // --- 12. 定時器與收藏夾 ---
    function startCountdownTimer() {
        clearInterval(AppState.countdownTimer);
        AppState.remainingSeconds = 15;
        document.getElementById('refreshCounterText').innerText = `${AppState.remainingSeconds}s`;

        AppState.countdownTimer = setInterval(() => {
            AppState.remainingSeconds--;
            if (AppState.remainingSeconds <= 0) {
                AppState.remainingSeconds = 15;
                if (AppState.selectedRoute) {
                    fetchRouteStopsAndEta(AppState.selectedRoute, AppState.selectedBound);
                }
            }
            document.getElementById('refreshCounterText').innerText = `${AppState.remainingSeconds}s`;
        }, 1000);
    }

    function toggleFavorite(company, route, service_type = '1') {
        const key = `${company}_${route}_${service_type}`;
        const idx = AppState.favorites.indexOf(key);
        const dict = I18N[AppState.lang];

        if (idx >= 0) {
            AppState.favorites.splice(idx, 1);
            showToast(`${dict.favRemove}: ${route}`, 'info');
        } else {
            AppState.favorites.push(key);
            showToast(`${dict.favAdd}: ${company} ${route}`, 'success');
        }

        localStorage.setItem('hk_bus_favorites', JSON.stringify(AppState.favorites));
        updateFavCount();
        renderRouteList();
        updateDetailFavIcon();
    }

    function toggleCurrentFavorite() {
        if (!AppState.selectedRoute) return;
        const r = AppState.selectedRoute;
        toggleFavorite(r.company, r.route, r.service_type || '1');
    }

    function updateFavCount() {
        document.getElementById('favCount').innerText = AppState.favorites.length;
    }

    function updateDetailFavIcon() {
        if (!AppState.selectedRoute) return;
        const r = AppState.selectedRoute;
        const key = `${r.company}_${r.route}_${r.service_type || '1'}`;
        const isFav = AppState.favorites.includes(key);
        const icon = document.getElementById('favCurrentIcon');
        icon.className = isFav ? 'fa-solid fa-star text-amber-400 text-sm' : 'fa-regular fa-star text-sm';
    }

    // --- 13. GPS 定位 ---
    function locateUser() {
        const dict = I18N[AppState.lang];
        if (!navigator.geolocation) {
            showToast(dict.locateError, 'error');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;

                if (AppState.userMarker) {
                    AppState.map.removeLayer(AppState.userMarker);
                }

                const userIcon = L.divIcon({
                    className: 'user-pin',
                    html: '<div class="custom-user-icon" style="width: 16px; height: 16px;"></div>',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                AppState.userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(AppState.map);
                AppState.map.flyTo([lat, lng], 15);
                showToast(dict.locateSuccess, 'success');
            },
            () => {
                showToast(dict.locateError, 'error');
            },
            { enableHighAccuracy: true, timeout: 8000 }
        );
    }

    function locateUserAndFindNearby() {
        locateUser();
        if (window.innerWidth < 1024 && !AppState.isMobileMapActive) {
            toggleMobileView();
        }
    }

    function toggleMobileView() {
        AppState.isMobileMapActive = !AppState.isMobileMapActive;
        const sidebar = document.getElementById('sidebarSection');
        const icon = document.getElementById('toggleIcon');

        if (AppState.isMobileMapActive) {
            sidebar.classList.add('hidden');
            icon.className = 'fa-solid fa-list-ul';
            AppState.map.invalidateSize();
        } else {
            sidebar.classList.remove('hidden');
            icon.className = 'fa-solid fa-map';
        }
    }

    // --- 14. 輔助工具與 Toast 通知 ---
    function calculateMinutesDiff(etaIso) {
        if (!etaIso) return null;
        const target = new Date(etaIso).getTime();
        const now = Date.now();
        const diffMs = target - now;
        const diffMins = Math.round(diffMs / 60000);
        return diffMins < 0 ? 0 : diffMins;
    }

    function formatTime(etaIso) {
        if (!etaIso) return '--:--';
        const d = new Date(etaIso);
        if (isNaN(d.getTime())) return etaIso;
        return d.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit' });
    }

    function showToast(msg, type = 'info') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');

        toastMsg.innerText = msg;
        if (type === 'success') {
            toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
        } else if (type === 'error') {
            toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400';
        } else {
            toastIcon.className = 'fa-solid fa-circle-info text-teal-400';
        }

        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');

        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
    }
</script>
